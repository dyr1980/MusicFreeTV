name: build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache React Native dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-rn-${{ hashFiles('package-lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-rn-

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Replace Gradle Repositories with Aliyun Mirrors
        run: |
          cp android/build.gradle android/build.gradle.bak
          cp android/settings.gradle android/settings.gradle.bak

          python3 - << 'PYEOF'
          def replace_repos(text):
              text = text.replace("google()", "maven { url 'https://maven.aliyun.com/repository/google' }")
              text = text.replace("mavenCentral()", "maven { url 'https://maven.aliyun.com/repository/public' }")
              text = text.replace("gradlePluginPortal()", "maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }")
              return text

          for path in ["android/build.gradle", "android/settings.gradle"]:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = replace_repos(content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"✅ 已替换 {path} 的仓库地址")
          PYEOF

          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle

      - name: Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          EOF
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --parallel --build-cache --configure-on-demand

      - name: List generated APKs
        run: |
          echo "📱 Generated APK files:"
          find android/app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \;

      - name: Restore original Gradle files
        if: always()
        run: |
          mv android/build.gradle.bak android/build.gradle
          mv android/settings.gradle.bak android/settings.gradle

      - name: Rename APKs and Generate SHA256SUMS
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_DIR="android/app/build/outputs/apk/release"
          OUT_DIR="release-output"
          mkdir -p "$OUT_DIR"

          echo "📦 版本号: $VERSION"

          # 重命名规则：app-{abi}-release.apk → MusicFreeTV-{version}-{abi}.apk
          rename_map=(
            "app-arm64-v8a-release.apk:MusicFreeTV-${VERSION}-arm64-v8a.apk"
            "app-armeabi-v7a-release.apk:MusicFreeTV-${VERSION}-armeabi-v7a.apk"
            "app-universal-release.apk:MusicFreeTV-${VERSION}-universal.apk"
            "app-x86-release.apk:MusicFreeTV-${VERSION}-x86.apk"
            "app-x86_64-release.apk:MusicFreeTV-${VERSION}-x86_64.apk"
          )

          for entry in "${rename_map[@]}"; do
            src="${entry%%:*}"
            dst="${entry##*:}"
            if [ -f "$APK_DIR/$src" ]; then
              cp "$APK_DIR/$src" "$OUT_DIR/$dst"
              echo "✅ $src → $dst"
            else
              echo "⚠️ 未找到 $src，跳过"
            fi
          done

          # 生成 SHA256SUMS.txt
          cd "$OUT_DIR"
          sha256sum *.apk > SHA256SUMS.txt
          echo ""
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          echo ""
          echo "=== 输出目录内容 ==="
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "🎉 正式版构建成功"
          echo "📦 Version: $(node -p "require('./package.json').version")"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}"
